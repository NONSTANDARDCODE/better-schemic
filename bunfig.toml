[[lint.overrides]]
files = ["**/*.spec.ts", "**/*.spec-utils.ts"]
[lint.overrides.rules]
"@typescript-eslint/no-magic-numbers" = "off"

[[lint.overrides]]
files = ["**/scripts/**/*.ts"]
[lint.overrides.rules]
"@typescript-eslint/no-magic-numbers" = "off"

[[lint.overrides]]
files = ["**/*.spec.ts", "**/*.e2e.spec.ts"]
[lint.overrides.rules]
"vitest/expect-expect" = ["error", { assertFunctionNames = ["expect", "expectRejection", "expectHandled", "expectResponse", "expectRefineError", "expectPassedThrough", "expectOrderGone", "expectBlocked", "expectAiChatCall", "expectDateIssue"] }]

[[lint.overrides]]
files = ["**/*.test.ts", "**/*.spec.ts", "**/*.e2e.ts"]
[lint.overrides.rules]
max-lines-per-function = "off"

[[lint.overrides]]
files = ["**/*.tsx", "**/*.animations.ts", "**/*.settings.ts", "**/*.stories.ts", "**/*.types.ts"]
[lint.overrides.rules]
"unicorn/filename-case" = "off"

[[lint.overrides]]
files = ["**/*.test.ts", "**/*.spec.ts", "**/*.spec-utils.ts", "**/*.e2e.ts"]
[lint.overrides.rules]
"@typescript-eslint/no-unsafe-member-access" = "off"
"@typescript-eslint/no-unsafe-argument" = "off"
"@typescript-eslint/no-unsafe-call" = "off"
"@typescript-eslint/no-unsafe-assignment" = "off"

[[lint.overrides]]
files = ["**/*.decorator.ts"]
[lint.overrides.rules]
"@typescript-eslint/naming-convention" = ["error", { selector = ["function"], format = ["camelCase", "PascalCase"] }]

[[lint.overrides]]
files = ["**/*.spec.ts", "**/*.spec-utils.ts", "**/*.test.ts", "**/*.e2e.ts", "apps/core/test/**/*.ts"]
[lint.overrides.rules]
"unicorn/no-useless-undefined" = "off"

[[lint.overrides]]
files = ["*.config.mjs", "**/*.config.mjs"]
[lint.overrides.rules]
"@typescript-eslint/no-unsafe-assignment" = "off"
