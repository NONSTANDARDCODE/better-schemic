[lint]
typeCheck = true
ignorePatterns = [
  "**/coverage/**",
  "**/build/**",
  "**/dist/**",
  "**/.output/**",
  "**/.astro/**",
  "**/.wrangler/**",
  "**/.better-schemic/**",
  "**/src/db/generated/**",
  # Cookbooks + POCs: their exact source is part of the docs/manifests, not library code.
  "**/docs/**",
  "**/examples/**",
  "**/coverage/**",
  "gists/**",
  "*.min.js",
]
plugins = [
  "eslint-plugin-perfectionist",
  "eslint-plugin-functional",
  "eslint-plugin-write-good-comments",
  "eslint-plugin-simple-import-sort",
  "eslint-plugin-boundaries",
  { name = "unicorn-plugin", specifier = "eslint-plugin-unicorn" },
]

[lint.rules]
# REGRAS DESATIVADAS (mantidas no arquivo, todas `off`)
"@typescript-eslint/explicit-function-return-type" = "off"
"@typescript-eslint/explicit-module-boundary-types" = "off"
"@typescript-eslint/no-extraneous-class" = "off"
"@typescript-eslint/only-throw-error" = "off"
"@typescript-eslint/prefer-nullish-coalescing" = "off"
"@typescript-eslint/restrict-template-expressions" = "off"
"@typescript-eslint/unbound-method" = "off"
constructor-super = "off"
dot-notation = "off"
getter-return = "off"
max-lines-per-function = "off"
max-params = "off"
no-array-constructor = "off"
no-class-assign = "off"
no-const-assign = "off"
no-dupe-args = "off"
no-dupe-class-members = "off"
no-dupe-keys = "off"
no-duplicate-imports = "off"
no-func-assign = "off"
no-implied-eval = "off"
no-import-assign = "off"
no-negated-condition = "off"
no-nested-ternary = "off"
no-new-native-nonconstructor = "off"
no-new-symbol = "off"
no-obj-calls = "off"
no-redeclare = "off"
no-restricted-syntax = "off"
no-return-await = "off"
no-setter-return = "off"
no-this-before-super = "off"
no-throw-literal = "off"
no-undef = "off"
no-unreachable = "off"
no-unsafe-negation = "off"
no-unused-expressions = "off"
no-unused-vars = "off"
no-useless-constructor = "off"
no-with = "off"
prefer-promise-reject-errors = "off"
require-await = "off"
sort-imports = "off"
"unicorn-plugin/expiring-todo-comments" = "off"
"unicorn-plugin/no-keyword-prefix" = "off"
"unicorn-plugin/no-unused-properties" = "off"
"unicorn-plugin/prevent-abbreviations" = "off"
"unicorn-plugin/string-content" = "off"
"unicorn/custom-error-definition" = "off"
"unicorn/filename-case" = "off"
"unicorn/import-style" = "off"
"unicorn/no-array-callback-reference" = "off"
"unicorn/no-array-for-each" = "off"
"unicorn/no-array-reduce" = "off"
"unicorn/no-null" = "off" # null é contrato: payload da Meta, SurrealDB e JSON opcional

# REGRAS DE MAIOR IMPACTO — estrutura, arquitetura e refatorações amplas
no-param-reassign = "error"
"prettier/prettier" = ["error", { semi = false, tabWidth = 2, useTabs = false, printWidth = 100 }]
"import/no-unused-modules" = "error"
"@typescript-eslint/consistent-type-imports" = "error"
"@typescript-eslint/unified-signatures" = "error"
"@typescript-eslint/adjacent-overload-signatures" = "error"
"@typescript-eslint/array-type" = "error"
"@typescript-eslint/consistent-generic-constructors" = "error"
"@typescript-eslint/consistent-indexed-object-style" = "error"
"@typescript-eslint/consistent-type-assertions" = "error"
"@typescript-eslint/consistent-type-definitions" = ["error", "type"]
"write-good-comments/write-good-comments" = "error"
max-depth = ["error", 3]
"functional/no-loop-statements" = "error"
"functional/functional-parameters" = ["error", { allowRestParameter = true, allowArgumentsKeyword = false, enforceParameterCount = false }]
"functional/readonly-type" = ["error", "keyword"]
"simple-import-sort/imports" = ["error", { groups = [["^\\u0000"], ["^react$", "^node:"], ["^[^.]"], ["^@/"], ["^../"], ["^./"]] }]
"simple-import-sort/exports" = "error"
"perfectionist/sort-array-includes" = ["error", { type = "natural" }]
"perfectionist/sort-enums" = ["error", { type = "natural" }]
"perfectionist/sort-interfaces" = ["error", { type = "natural" }]
"perfectionist/sort-jsx-props" = ["error", { type = "natural" }]
"perfectionist/sort-maps" = ["error", { type = "natural" }]
"perfectionist/sort-named-exports" = ["error", { type = "natural" }]
"perfectionist/sort-object-types" = ["error", { type = "natural" }]
"perfectionist/sort-objects" = ["error", { type = "natural" }]
"perfectionist/sort-union-types" = ["error", { type = "natural" }]
"@typescript-eslint/naming-convention" = ["error", { selector = ["function"], format = ["camelCase", "PascalCase"] }]
"@typescript-eslint/prefer-readonly" = "error"

# TIPAGEM ESTRITA — mudanças de tipos e contratos
"@typescript-eslint/no-explicit-any" = "error"
"@typescript-eslint/no-unused-vars" = ["error", { argsIgnorePattern = "^_", varsIgnorePattern = "^_", ignoreRestSiblings = true }]
"@typescript-eslint/no-unsafe-return" = "error"
"@typescript-eslint/no-misused-promises" = "error"
"@typescript-eslint/no-base-to-string" = "error"
"@typescript-eslint/no-unnecessary-condition" = "error"
"@typescript-eslint/no-unnecessary-type-assertion" = "error"
"@typescript-eslint/no-unnecessary-type-conversion" = "error"
"@typescript-eslint/use-unknown-in-catch-callback-variable" = "error"
"@typescript-eslint/switch-exhaustiveness-check" = "error"
"@typescript-eslint/consistent-return" = "error"
"@typescript-eslint/no-non-null-assertion" = "error"
"@typescript-eslint/no-misused-new" = "error"
"@typescript-eslint/no-non-null-asserted-optional-chain" = "error"
"@typescript-eslint/no-unnecessary-type-constraint" = "error"
"@typescript-eslint/no-unsafe-declaration-merging" = "error"
"@typescript-eslint/no-unsafe-function-type" = "error"
"@typescript-eslint/no-confusing-void-expression" = "error"
"@typescript-eslint/no-deprecated" = "error"
"@typescript-eslint/no-duplicate-type-constituents" = "error"
"@typescript-eslint/no-invalid-void-type" = "error"
"@typescript-eslint/no-meaningless-void-operator" = "error"
"@typescript-eslint/no-misused-spread" = "error"
"@typescript-eslint/no-non-null-asserted-nullish-coalescing" = "error"
"@typescript-eslint/no-redundant-type-constituents" = "error"
"@typescript-eslint/no-unnecessary-boolean-literal-compare" = "error"
"@typescript-eslint/no-unnecessary-template-expression" = "error"
"@typescript-eslint/no-unnecessary-type-arguments" = "error"
"@typescript-eslint/no-unnecessary-type-parameters" = "error"
"@typescript-eslint/no-unsafe-argument" = "error"
"@typescript-eslint/no-unsafe-assignment" = "error"
"@typescript-eslint/no-unsafe-call" = "error"
"@typescript-eslint/no-unsafe-enum-assignment" = "error"
"@typescript-eslint/no-unsafe-enum-comparison" = "error"
"@typescript-eslint/no-unsafe-member-access" = "error"
"@typescript-eslint/no-unsafe-unary-minus" = "error"
"@typescript-eslint/prefer-promise-reject-errors" = "error"
"@typescript-eslint/restrict-plus-operands" = ["error", { allowAny = false, allowBoolean = false, allowNullish = false, allowNumberAndString = false, allowRegExp = false }]
"@typescript-eslint/return-await" = ["error", "error-handling-correctness-only"]
"@typescript-eslint/no-inferrable-types" = "error"
"@typescript-eslint/prefer-optional-chain" = "error"

# ASYNC / PROMISES — fluxo assíncrono e tratamento de promises
"@typescript-eslint/require-await" = "error"
"@typescript-eslint/await-thenable" = "error"
"@typescript-eslint/no-floating-promises" = "error"
no-promise-executor-return = "error"
no-async-promise-executor = "error"
"promise/always-return" = "error"
"promise/valid-params" = "error"
"@typescript-eslint/no-implied-eval" = "error"
"unicorn/no-await-expression-member" = "error"
"unicorn/no-unnecessary-await" = "error"
"unicorn/no-useless-promise-resolve-reject" = "error"
"unicorn/prefer-top-level-await" = "error"

# CORREÇÃO E SEGURANÇA — bugs, condições inválidas e construções perigosas
no-prototype-builtins = "error"
no-template-curly-in-string = "error"
no-self-compare = "error"
no-compare-neg-zero = "error"
"@typescript-eslint/no-unused-expressions" = "error"
"@typescript-eslint/no-magic-numbers" = ["error", { ignore = [-1, 0, 1], ignoreArrayIndexes = true, ignoreDefaultValues = true, ignoreEnums = true, ignoreNumericLiteralTypes = true, ignoreReadonlyClassProperties = true }]
curly = ["error", "multi-or-nest"]
"@typescript-eslint/no-array-constructor" = "error"
"@typescript-eslint/no-duplicate-enum-values" = "error"
"@typescript-eslint/no-empty-object-type" = "error"
"@typescript-eslint/no-extra-non-null-assertion" = "error"
"@typescript-eslint/no-namespace" = "error"
"@typescript-eslint/no-require-imports" = "error"
"@typescript-eslint/no-this-alias" = "error"
"@typescript-eslint/no-wrapper-object-types" = "error"
"@typescript-eslint/no-restricted-types" = ["error", { types = { object = "Prefira um tipo concreto ou Record<string, unknown> (AOT não infere layout de `object`)" } }]
no-var = "error"
prefer-const = "error"
for-direction = "error"
no-case-declarations = "error"
no-cond-assign = "error"
no-constant-binary-expression = "error"
no-constant-condition = "error"
