name: CI

# Mirrors the local `land.ts` gate (build -> typecheck -> test across the workspace) so external PRs
# are verified automatically — `land.ts` only gates what core-dev lands, not contributor PRs.
on:
  push:
    branches: [main]
  pull_request:

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: build · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Frozen lockfile = exact committed deps, so the surrealdb SDK stays pinned at 2.0.3
      # (a re-resolve would bump it and hang the e2e .connect()).
      - name: Install
        run: bun install --frozen-lockfile

      # Order matches land.ts: build first so typecheck/test run against fresh lib/, not stale output.
      - name: Build
        run: bun run --filter '*' build

      - name: Typecheck
        run: bun run --filter '*' typecheck

      # Live/parity suites need the `surreal` binary; without it they skip gracefully here. The
      # `coverage` job below installs the binary so they actually run under the MC/DC gate.
      - name: Test
        run: bun run --filter '*' test

  # MC/DC-equivalent coverage gate (branch + logical-condition) over drivers/surrealdb/src +
  # packages/core/src. SEPARATE job: it installs the `surreal` binary so the live/parity suites run
  # (never skip), instruments the suite, and fails on any per-file regression below its ratchet floor.
  # See drivers/surrealdb/docs/TESTING.md.
  coverage:
    name: coverage (MC/DC gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # The local `surreal` binary (pinned) so `spawnEphemeralServer` + the shared live preload run.
      - name: Install SurrealDB
        run: |
          curl -sSf https://install.surrealdb.com | sh -s -- --version v3.2.0
          echo "$HOME/.surrealdb" >> "$GITHUB_PATH"

      - name: Coverage gate
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore


  # Mutation gate (StrykerJS + a custom Bun test runner) over the scoped pure compilers. OFFLINE —
  # no `surreal` binary needed — one Stryker process scheduling mutants dynamically across parallel
  # test-runner workers. Fails on any per-file mutation-score regression below `mutation.config.json`.
  # See drivers/surrealdb/docs/TESTING.md.
  mutation:
    name: mutation (Stryker · bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Mutation gate
        run: bun run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation
          path: .mutation/
          # `.mutation/` is a dot-directory, which upload-artifact skips unless hidden files are on.
          include-hidden-files: true
          if-no-files-found: ignore


  # Type-completeness + instantiation-budget suites. Compile-time asserts (`assertType`) ride the
  # normal `tsgo --noEmit` typecheck; this job only enforces the `.bench.ts` budgets — one tsgo
  # program per bench file, ±20% threshold (`scripts/type-bench.ts`, no node/tsx needed).
  type-bench:
    name: type-bench (tsgo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type-bench suites
        run: bun run scripts/type-bench.ts
