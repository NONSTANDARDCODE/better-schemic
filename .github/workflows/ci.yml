name: CI

# Mirrors the local `land.ts` gate (build -> typecheck -> test -> lint -> knip across the workspace) so external PRs
# are verified automatically — `land.ts` only gates what core-dev lands, not contributor PRs.
on:
  push:
    branches: [main]
  pull_request:

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: build · typecheck · test · lint · knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Frozen lockfile = exact committed deps, so the surrealdb SDK stays pinned.
      - name: Install
        run: bun install --frozen-lockfile

      # Order matches land.ts: build first so typecheck/test run against fresh lib/, not stale output.
      - name: Build
        run: bun run --filter '*' build

      - name: Typecheck
        run: bun run --filter '*' typecheck

      - name: Test
        run: bun run --filter '*' test

      # Quality gates — root config (bunfig.toml / knip.json), so both run once from the repo root.
      - name: Lint
        run: bun run lint

      - name: Knip (unused files, exports, types and dependencies)
        run: bun run knip
