name: Renovate

# Self-hosted Renovate. RENOVATE_TOKEN must be a PAT (classic: `repo` + `workflow`
# scopes; fine-grained: Contents, Issues, Pull requests and Workflows = write).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
